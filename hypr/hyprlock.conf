# ═══════════════════════════════════════════════════════════════
# HYPRLOCK — CYBERPUNK RED
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────

general {
	hide_cursor = true
	grace = 0
	no_fade_in = false
	no_fade_out = false
	ignore_empty_input = false
}

# ─────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────

background {
    monitor =
    path = screenshot

    blur_passes = 2
    blur_size = 3

    color = rgba(8, 8, 12, 0.60)

    brightness = 0.75
    vibrancy = 0.25
    vibrancy_darkness = 0.8
}

# ─────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────

label {
	monitor =
	text = $TIME


	font_family = GohuFont14 Nerd Font Mono
	font_size = 96
	font_weight = 700

	color = rgba(238, 238, 242, 1.0)

	shadow_passes = 2
	shadow_size = 4
	shadow_color = rgba(0, 0, 0, 0.65)

	position = 0, 150

	halign = center
	valign = center
}

# ─────────────────────────────────────────
# DATE
# ─────────────────────────────────────────

label {
	monitor =
	text = cmd[update:60000] date '+%A  •  %d %B %Y'


	font_family = GohuFont14 Nerd Font Mono
	font_size = 18
	font_weight = 500

	color = rgba(160, 160, 170, 0.9)

	position = 0, 55

	halign = center
	valign = center
}

# ─────────────────────────────────────────
# USER
# ─────────────────────────────────────────

label {
	monitor =
	text = $USER

	font_family = GohuFont14 Nerd Font Mono
	font_size = 24
	font_weight = 600

	color = rgba(212, 0, 0, 1.0)

	shadow_passes = 2
	shadow_size = 3
	shadow_color = rgba(212, 0, 0, 0.30)

	position = 0, -20

	halign = center
	valign = center
}

# ─────────────────────────────────────────
# USER STATUS
# ─────────────────────────────────────────

label {
	monitor =
	text = "AUTHENTICATION REQUIRED"
	
	font_family = GohuFont14 Nerd Font Mono
	font_size = 12
	font_weight = 500
	
	color = rgba(133, 133, 142, 0.85)

	position = 0, -55

	halign = center
	valign = center
}

# ─────────────────────────────────────────
# PASSWORD FIELD
# ─────────────────────────────────────────

input-field {
	monitor =


	size = 360, 64

	outline_thickness = 2

	dots_size = 0.25
	dots_spacing = 0.18
	dots_center = true

	outer_color = rgba(212, 0, 0, 0.55)
	inner_color = rgba(13, 13, 17, 0.88)

	font_family = GohuFont14 Nerd Font Mono
	font_size = 18

	font_color = rgba(238, 238, 242, 1.0)

	fade_on_empty = false

	placeholder_text = <i>ENTER PASSWORD</i>

	check_color = rgba(212, 0, 0, 1.0)
	fail_color = rgba(255, 0, 0, 1.0)

	fail_text = <i>AUTHENTICATION FAILED</i>

	position = 0, -125

	halign = center
	valign = center
}

# ─────────────────────────────────────────
# SYSTEM INFORMATION
# ─────────────────────────────────────────

label {
	monitor =
	text = cmd[update:5000] echo "  $(awk '{printf "%.0f", $1 * 100 / 4}' /proc/loadavg)% LOAD"

	font_family = GohuFont14 Nerd Font Mono
	font_size = 13
	font_weight = 500

	color = rgba(120, 120, 130, 0.9)

	position = -35, 35

	halign = right
	valign = bottom
}

label {
	monitor =
	text = cmd[update:5000] free -h | awk '/Mem:/ {print "󰍛  " $3 " / " $2}'

	font_family = GohuFont14 Nerd Font Mono
	font_size = 13
	font_weight = 500

	color = rgba(120, 120, 130, 0.9)

	position = -35, 65

	halign = right
	valign = bottom
}

label {
	monitor =
	text = cmd[update:5000] df -h / | awk 'NR==2 {print "󰋊  " $3 " / " $2}'

	font_family = GohuFont14 Nerd Font Mono
	font_size = 13
	font_weight = 500

	color = rgba(120, 120, 130, 0.9)

	position = -35, 95

	halign = right
	valign = bottom
}

# ─────────────────────────────────────────
# LOCK STATUS
# ─────────────────────────────────────────

label {
	monitor =
	text = "● SYSTEM LOCKED"

	font_family = GohuFont14 Nerd Font Mono
	font_size = 11
	font_weight = 600

	color = rgba(114, 0, 0, 0.95)

	position = 35, 35

	halign = left
	valign = bottom
}

# ─────────────────────────────────────────
# KEYBOARD STATUS
# ─────────────────────────────────────────

label {
	monitor =
	text = cmd[update:1000] "echo '  '$(localectl status 2>/dev/null | awk -F: '/X11 Layout/ {gsub(/ /, "", $2); print $2}')"

	font_family = GohuFont14 Nerd Font Mono
	font_size = 11
	font_weight = 500

	color = rgba(120, 120, 130, 0.85)

	position = 35, 65

	halign = left
	valign = bottom
}

# ═══════════════════════════════════════════════════════════════
# END
# ═══════════════════════════════════════════════════════════════

